<!DOCTYPE html>
<html>

<head>
  <title>Floss Boss</title>
  <script src="game-page.js"></script>
  <script src="https://unpkg.com/@rive-app/canvas"></script>
  <link rel="stylesheet" href="game-page.css">
</head>

<body>
  <div id="viewport">
    <div id="game-root">
      <video autoplay muted loop id="bg-video">
        <source src="game-page-assets/FlossBossScreen.mp4" type="video/mp4">
      </video>
      <img src="game-page-assets/FB-TIMES_UP.gif" alt="times-up" id="times-up">
      <audio id="times-up-audio" hidden> 
        <source src="game-page-assets/sound/FB-TIMES_UP.mp3" type="audio/mp3">
      </audio>
      <audio id="shrimply-audio" autoplay hidden>
        <source src="" type="audio/mp3">
      </audio>
      <img src="game-page-assets/Shrimp.svg" alt="shrimply" id="shrimply">
      <img src="game-page-assets/BACKGUMS.png" alt="bottom-gums" id="bottom-gums">
      <img src="game-page-assets/TOPTEETH.png" alt="top-teeth" id="top-teeth">
      <img src="game-page-assets/FRONTGUMS.png" alt="top-gums" id="top-gums">
      <div id="header">
        <div id="points">
          <img src="game-page-assets/PointSystem.svg" alt="points">
          <div id="points-text">0</div>
        </div>
        <div id="timer">
          <canvas id="progress-bar"></canvas>
          <div id="timer-text">1:00</div>
        </div>
      </div>
      <div id="player">
        <audio autoplay hidden id="background-music">
          <source src="game-page-assets/sound/shrimply-flossin.mp3" type="audio/mp3">
          If you're reading this, audio isn't supported.
        </audio>
      </div>
      <div id="countdown">3</div>
      <div id="teeth">
        <!-- left fang -->
        <canvas id="tooth-1"></canvas>
        <!-- regular teeth -->
        <canvas id="tooth-2"></canvas>
        <canvas id="tooth-3"></canvas>
        <canvas id="tooth-4"></canvas>
        <canvas id="tooth-5"></canvas>
        <!-- right fang -->
        <canvas id="tooth-6"></canvas>
      </div>
      <div id="footer">
        <div id="buttons">
          <a href="index.html" id="homeButton"><img src="/game-page-assets/homeDefault.svg"></a>
          <a href="game-page.html" id="replayButton"><img src="/game-page-assets/restartDefault.svg"></a>
          <a href="end-screen.html" id="skipButton"><img src="/game-page-assets/skipDefault.svg"></a>
        </div>
      </div>
    </div>
  </div>
</body>

</html>

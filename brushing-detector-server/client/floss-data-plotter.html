<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Live Floss Sensor Readings</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background: #111;
      color: #eee;
      font-family: sans-serif;
      text-align: center;
      margin: 2rem;
    }

    canvas {
      background: #222;
      border-radius: 10px;
      padding: 10px;
    }
  </style>
</head>

<body>
  <h1>🧵 Live Floss Sensor Readings</h1>
  <canvas id="sensorChart" width="1000" height="400"></canvas>

  <script>
    // SSE endpoint
    const eventSource = new EventSource('/gamedata');

    const NUM_SENSORS = 6;
    const MAX_POINTS = 100;

    const ctx = document.getElementById('sensorChart').getContext('2d');

    // Random colors for each floss sensor line
    const colors = Array.from({ length: NUM_SENSORS }, () =>
      `hsl(${Math.random() * 360}, 70%, 60%)`
    );

    const chartData = {
      labels: [],
      datasets: [
        ...Array.from({ length: NUM_SENSORS }, (_, i) => ({
          label: `Floss Sensor ${i}`,
          data: [],
          borderColor: colors[i],
          borderWidth: 2,
          tension: 0.2,
          fill: false,
        })),
        ...Array.from({ length: NUM_SENSORS }, (_, i) => ({
          label: `Baseline ${i}`,
          data: [],
          borderColor: colors[i],
          borderDash: [6, 6],   // 👈 dashed line
          borderWidth: 1,
          tension: 0.2,
          fill: false,
        }))
      ]
    };

    const chart = new Chart(ctx, {
      type: 'line',
      data: chartData,
      options: {
        responsive: true,
        animation: false,
        scales: {
          x: { display: false },
          y: {
            beginAtZero: true,
            title: { display: true, text: 'Floss Sensor Value' },
          },
        },
        plugins: {
          legend: { labels: { color: '#eee' } },
        },
      },
    });

    // Receive live data from server
    eventSource.onmessage = (event) => {
      const data = JSON.parse(event.data);

      // 👇 THIS IS THE ONLY IMPORTANT CHANGE
      const flossState = data.gameState.flossing;
      if (!flossState) return;

      const flossData = flossState.sensorValues;
      const baselineData = flossState.baselines;

      console.log("Floss sensor data:", flossData);

      // Timestamp label
      // Add timestamp
      chartData.labels.push(new Date().toLocaleTimeString());

      // Update live sensor lines
      for (let i = 0; i < NUM_SENSORS; i++) {
        chartData.datasets[i].data.push(flossData[i] ?? 0);
        if (chartData.datasets[i].data.length > MAX_POINTS)
          chartData.datasets[i].data.shift();
      }

      // Update baseline dashed lines
      for (let i = 0; i < NUM_SENSORS; i++) {
        const baselineDatasetIndex = i + NUM_SENSORS;
        chartData.datasets[baselineDatasetIndex].data.push(
          baselineData?.[i] ?? 0
        );

        if (chartData.datasets[baselineDatasetIndex].data.length > MAX_POINTS)
          chartData.datasets[baselineDatasetIndex].data.shift();
      }

      // Trim labels
      if (chartData.labels.length > MAX_POINTS)
        chartData.labels.shift();

      chart.update();
    };
  </script>
</body>

</html>

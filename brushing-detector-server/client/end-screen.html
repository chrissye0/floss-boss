<!DOCTYPE html>
<html>
<head>
  <title>Floss Boss</title>
  <link rel="icon" type="image/x-icon" href="/game-page-assets/john.png">
  <script src="end-screen.js"></script>
  <link rel="stylesheet" href="end-screen.css">
</head>
<body>
  <div id="viewport">
    <div id="end-root">
        <img src="game-page-assets/teeth-reference.svg" 
             alt="blurred-teeth-background" id="bg-img">

        <div id="containerDesign">
          <img src="game-page-assets/PopUpUpdated.png" alt="end-pop-up" id="pop-up">

          <div id="container">

            <div id="header">
                <!-- <a>-----------------------stat-----------------------</a> -->
                <img src="game-page-assets/stat.svg" alt="star" id="statBar">
            </div>

            <div id="stars">
              <img src="game-page-assets/star.svg" alt="star" class="starImg">
              <img src="game-page-assets/star.svg" alt="star" class="starImg">
              <img src="game-page-assets/star.svg" alt="star" class="starImg">
            </div>

            <div id = "stats">
              <div id="stat1">
                <h1>##</h1>
                <p>Teeth</p>
                <p>Flossed</p>
              </div>

              <div id="score">
                <h2 id="finalScore">##,###</h2>
                <p>Points</p>
              </div>

              <div id="stat2">
                <h1>##</h1>
                <p>Teeth</p>
                <p>Brushed</p>
              </div>
            </div>

            <footer>
              <div id="buttons">
                <a href="index.html" id="homeButton"><img src="/game-page-assets/homeDefault.svg"></a>
                <a href="game-page.html" id="replayButton"><img src="/game-page-assets/restartDefault.svg"></a>
              </div>
            </footer>

          </div>
        </div>
    </div>
  </div>

</html>
